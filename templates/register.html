<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FINAL — Register</title>
    <style>
      :root {
        --bg-deep: #0a0b1e;
        --card-bg: #14162e;
        --primary-glow: #8b5cf6;
        --secondary-glow: #3b82f6;
        --text-white: #f8fafc;
        --text-dim: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Plus Jakarta Sans", "Inter", sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: var(--bg-deep);
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(139, 92, 246, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(59, 130, 246, 0.15) 0%,
            transparent 40%
          );
        overflow-y: auto;
        padding: 40px 20px;
      }

      /* ── PARTICLES ── */
      .particles {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        animation: float linear infinite;
        opacity: 0;
      }
      .particle:nth-child(1) {
        width: 4px;
        height: 4px;
        background: #8b5cf6;
        left: 10%;
        animation-duration: 18s;
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        width: 6px;
        height: 6px;
        background: #3b82f6;
        left: 25%;
        animation-duration: 22s;
        animation-delay: 3s;
      }
      .particle:nth-child(3) {
        width: 3px;
        height: 3px;
        background: #8b5cf6;
        left: 40%;
        animation-duration: 16s;
        animation-delay: 6s;
      }
      .particle:nth-child(4) {
        width: 5px;
        height: 5px;
        background: #7c3aed;
        left: 55%;
        animation-duration: 20s;
        animation-delay: 1s;
      }
      .particle:nth-child(5) {
        width: 4px;
        height: 4px;
        background: #3b82f6;
        left: 70%;
        animation-duration: 24s;
        animation-delay: 4s;
      }
      .particle:nth-child(6) {
        width: 6px;
        height: 6px;
        background: #8b5cf6;
        left: 85%;
        animation-duration: 19s;
        animation-delay: 7s;
      }
      .particle:nth-child(7) {
        width: 3px;
        height: 3px;
        background: #7c3aed;
        left: 15%;
        animation-duration: 21s;
        animation-delay: 2s;
      }
      .particle:nth-child(8) {
        width: 5px;
        height: 5px;
        background: #3b82f6;
        left: 60%;
        animation-duration: 17s;
        animation-delay: 5s;
      }

      @keyframes float {
        0% {
          transform: translateY(110vh) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.4;
        }
        100% {
          transform: translateY(-10vh) scale(1);
          opacity: 0;
        }
      }

      /* ── CARD ── */
      .card {
        background: var(--card-bg);
        width: 100%;
        max-width: 420px;
        padding: 42px 38px;
        border-radius: 28px;
        position: relative;
        z-index: 10;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
        animation: card-in 0.5s ease;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 29px;
        padding: 1px;
        background: linear-gradient(
          135deg,
          var(--primary-glow),
          var(--secondary-glow)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.5;
        pointer-events: none;
      }

      /* ── HEADER ── */
      .header {
        text-align: center;
        margin-bottom: 16px;
      }

      .header-icon {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #34d399, #3b82f6);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 20px;
        box-shadow: 0 4px 20px rgba(52, 211, 153, 0.4);
        animation: icon-glow 3s ease-in-out infinite;
      }

      @keyframes icon-glow {
        0%,
        100% {
          box-shadow: 0 4px 20px rgba(52, 211, 153, 0.35);
        }
        50% {
          box-shadow: 0 4px 32px rgba(52, 211, 153, 0.7);
        }
      }

      .header h1 {
        color: var(--text-white);
        font-size: 1.7rem;
        letter-spacing: -0.5px;
      }
      .header p {
        color: var(--text-dim);
        font-size: 0.84rem;
        margin-top: 4px;
      }

      /* ── ALERT BOXES ── */
      .box {
        padding: 11px 14px;
        border-radius: 12px;
        font-size: 13px;
        margin-bottom: 10px;
        line-height: 1.5;
        border: 1px solid;
        display: none;
      }

      .box.show {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .box.error {
        background: rgba(248, 113, 113, 0.1);
        border-color: rgba(248, 113, 113, 0.3);
        color: #f87171;
      }

      .box.success {
        background: rgba(52, 211, 153, 0.1);
        border-color: rgba(52, 211, 153, 0.3);
        color: #34d399;
      }

      /* ── FIELDS ── */
      .field {
        margin-bottom: 7px;
      }

      .field label {
        display: block;
        color: var(--text-white);
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 4px;
        margin-left: 2px;
      }

      .field input {
        width: 100%;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 15px;
        border-radius: 14px;
        color: var(--text-white);
        font-size: 0.92rem;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      .field input::placeholder {
        color: rgba(255, 255, 255, 0.22);
      }

      .field input:focus {
        outline: none;
        border-color: var(--primary-glow);
        background: rgba(139, 92, 246, 0.06);
        box-shadow: 0 0 18px rgba(139, 92, 246, 0.12);
      }

      .field input.ok {
        border-color: #34d399;
        background: rgba(52, 211, 153, 0.04);
      }
      .field input.bad {
        border-color: #f87171;
        background: rgba(248, 113, 113, 0.04);
      }

      /* ── HINT ── */
      .hint {
        font-size: 11px;
        margin-top: 3px;
        min-height: 12px;
        padding-left: 3px;
        color: var(--text-dim);
        transition: all 0.2s;
      }
      .hint.ok {
        color: #34d399;
      }
      .hint.bad {
        color: #f87171;
      }

      /* ── STRENGTH BAR ── */
      .strength-wrap {
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        margin-top: 6px;
        overflow: hidden;
      }

      .strength-bar {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        transition:
          width 0.4s ease,
          background 0.4s ease;
      }

      /* ── BUTTON ── */
      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--primary-glow), #7c3aed);
        border: none;
        border-radius: 14px;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-top: 8px;
        font-family: inherit;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(139, 92, 246, 0.45);
      }

      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      /* ── FOOTER ── */
      .footer {
        text-align: center;
        margin-top: 18px;
        color: var(--text-dim);
        font-size: 0.88rem;
      }

      .footer a {
        color: var(--text-white);
        text-decoration: none;
        font-weight: 600;
      }
      .footer a:hover {
        color: #a78bfa;
      }

      /* ── SECURITY NOTE ── */
      .security-note {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 14px;
        font-size: 11px;
        color: var(--text-dim);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 10px 13px;
        border-radius: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- PARTICLES -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- CARD -->
    <div class="card">
      <div class="header">
        <h1>Create Account</h1>
      </div>

      <div id="box-error" class="box error"></div>
      <div id="box-success" class="box success"></div>

      {% if error %}
      <div class="box error show">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/register">
        <div class="field">
          <label>Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
            oninput="checkUsername(this)"
          />
          <div class="hint" id="hint-user"></div>
        </div>

        <div class="field">
          <label>Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            required
            oninput="checkEmail(this)"
          />
          <div class="hint" id="hint-email"></div>
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Min 12 characters"
            minlength="12"
            required
            oninput="checkPassword(this)"
          />

          <div class="hint" id="hint-pass"></div>
        </div>

        <div class="field">
          <label>Confirm Password</label>
          <input
            type="password"
            id="confirm"
            name="confirm"
            placeholder="Repeat password"
            oninput="checkConfirm(this)"
          />
          <div class="hint" id="hint-confirm"></div>
        </div>

        <button class="btn" id="submitBtn">Create Account →</button>
      </form>

      <div class="footer">Already have an account? <a href="/">Sign in</a></div>
    </div>

    <script>
      const taken = ["alice", "bob", "charlie", "diana", "admin"];

      function checkUsername(el) {
        const v = el.value.trim();
        const h = document.getElementById("hint-user");
        if (!v) {
          el.className = "";
          h.textContent = "";
          h.className = "hint";
          return;
        }
        if (v.length < 3) {
          el.className = "bad";
          h.textContent = "At least 3 characters required";
          h.className = "hint bad";
          return;
        }
        if (taken.includes(v.toLowerCase())) {
          el.className = "bad";
          h.textContent = "Username already taken";
          h.className = "hint bad";
          return;
        }
        el.className = "ok";
        h.textContent = "✓ Username available";
        h.className = "hint ok";
      }

      function checkEmail(el) {
        const v = el.value.trim();
        const h = document.getElementById("hint-email");
        if (!v) {
          el.className = "";
          h.textContent = "";
          h.className = "hint";
          return;
        }
        const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        if (!valid) {
          el.className = "bad";
          h.textContent = "Enter a valid email address";
          h.className = "hint bad";
          return;
        }
        el.className = "ok";
        h.textContent = "✓ Valid email";
        h.className = "hint ok";
      }

      function checkPassword(el) {
        const v = el.value;
        const h = document.getElementById("hint-pass");
        const bar = document.getElementById("sbar");
        if (!v) {
          el.className = "";
          h.textContent = "";
          bar.style.width = "0%";
          return;
        }

        if (v.length < 12) {
          el.className = "bad";
          h.textContent = "At least 12 characters required";
          h.className = "hint bad";
          bar.style.width = "20%";
          bar.style.background = "#f87171";
          checkConfirm(document.getElementById("confirm"));
          return;
        }

        let strength = 0;
        if (v.length >= 12) strength++;
        if (v.length >= 16) strength++;
        if (/[A-Z]/.test(v)) strength++;
        if (/[0-9]/.test(v)) strength++;
        if (/[^A-Za-z0-9]/.test(v)) strength++;

        const labels = ["", "Weak", "Fair", "Good", "Strong", "Very Strong"];
        const colors = [
          "",
          "#f87171",
          "#fbbf24",
          "#fbbf24",
          "#34d399",
          "#8b5cf6",
        ];
        const widths = ["0%", "20%", "40%", "60%", "80%", "100%"];

        bar.style.width = widths[strength];
        bar.style.background = colors[strength];
        h.textContent = strength >= 1 ? labels[strength] : "";
        h.className = strength >= 3 ? "hint ok" : "hint bad";
        el.className = strength >= 2 ? "ok" : "bad";

        checkConfirm(document.getElementById("confirm"));
      }

      function checkConfirm(el) {
        const v = el.value;
        const p = document.getElementById("password").value;
        const h = document.getElementById("hint-confirm");
        if (!v) {
          el.className = "";
          h.textContent = "";
          h.className = "hint";
          return;
        }
        if (v === p) {
          el.className = "ok";
          h.textContent = "✓ Passwords match";
          h.className = "hint ok";
        } else {
          el.className = "bad";
          h.textContent = "Passwords do not match";
          h.className = "hint bad";
        }
      }

      function handleRegister() {
        const u = document.getElementById("username").value.trim();
        const e = document.getElementById("email").value.trim();
        const p = document.getElementById("password").value;
        const c = document.getElementById("confirm").value;

        document.getElementById("box-error").classList.remove("show");
        document.getElementById("box-success").classList.remove("show");

        if (!u || !e || !p || !c) {
          showError("All fields are required.");
          return;
        }
        if (u.length < 3) {
          showError("Username must be at least 3 characters.");
          return;
        }
        if (taken.includes(u.toLowerCase())) {
          showError("Username already taken.");
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) {
          showError("Enter a valid email address.");
          return;
        }
        if (p.length < 12) {
          showError("Password must be at least 12 characters.");
          return;
        }
        if (p !== c) {
          showError("Passwords do not match.");
          return;
        }

        const s = document.getElementById("box-success");
        s.textContent = `✓ Account created for "${u}". You can now sign in.`;
        s.classList.add("show");
        document.getElementById("submitBtn").disabled = true;
        taken.push(u.toLowerCase());
      }

      function showError(msg) {
        const el = document.getElementById("box-error");
        el.textContent = msg;
        el.classList.add("show");
      }
    </script>
  </body>
</html>
