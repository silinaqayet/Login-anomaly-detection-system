<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
    <style>
      :root {
        --bg-deep: #0a0b1e;
        --card-bg: #14162e;
        --primary-glow: #8b5cf6;
        --secondary-glow: #3b82f6;
        --text-white: #f8fafc;
        --text-dim: #94a3b8;
      }
      * {
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", "Inter", sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: var(--bg-deep);
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(139, 92, 246, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(59, 130, 246, 0.15) 0%,
            transparent 40%
          );
      }
      .login-card {
        background: var(--card-bg);
        width: 100%;
        max-width: 420px;
        padding: 50px 40px;
        border-radius: 28px;
        position: relative;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .login-card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 29px;
        padding: 1px;
        background: linear-gradient(
          135deg,
          var(--primary-glow),
          var(--secondary-glow)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.5;
        pointer-events: none;
      }
      .header {
        text-align: center;
        margin-bottom: 40px;
      }
      .header h1 {
        color: var(--text-white);
        font-size: 2rem;
        margin: 0;
        letter-spacing: -1px;
      }
      .header p {
        color: var(--text-dim);
        font-size: 0.95rem;
        margin-top: 8px;
      }
      .alert-error {
        background: rgba(255, 71, 87, 0.12);
        border: 1px solid rgba(255, 71, 87, 0.4);
        color: #ff4757;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .input-wrapper {
        margin-bottom: 24px;
      }
      .input-wrapper label {
        display: block;
        color: var(--text-white);
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .input-field {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 14px 18px;
        border-radius: 14px;
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
      }
      .input-field::placeholder {
        color: rgba(148, 163, 184, 0.5);
      }
      .input-field:focus {
        border-color: var(--primary-glow);
        background: rgba(139, 92, 246, 0.05);
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
      }
      .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary-glow), #7c3aed);
        border: none;
        border-radius: 14px;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-top: 10px;
      }
      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
      }
      .submit-btn:active {
        transform: translateY(0);
      }
      .signup-text {
        text-align: center;
        margin-top: 30px;
        color: var(--text-dim);
        font-size: 0.85rem;
      }
      .signup-text a {
        color: var(--primary-glow);
        text-decoration: none;
        font-weight: 600;
      }
      .signup-text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="header">
        <h1>login page</h1>
      </div>

      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="input-wrapper">
          <label>Username</label>
          <input
            type="text"
            name="username"
            class="input-field"
            placeholder="Enter your username"
            required
          />
        </div>

        <div class="input-wrapper">
          <label>Password</label>
          <input
            type="password"
            name="password"
            class="input-field"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="submit-btn">Sign In →</button>
      </form>

      <div class="signup-text">
        Don't have an account? <a href="/register">Create one</a>
      </div>
    </div>
  </body>
</html>
